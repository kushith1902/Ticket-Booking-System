<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital QR Ticket | TicketFlow</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        @media print {
            .navbar, .ticket-actions { display: none !important; }
            body { background: #fff !important; color: #000 !important; }
            .ticket-container { border: 2px solid #000 !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">🎟 <span>TicketFlow</span></a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-actions" id="nav-actions"></div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 80px;" id="ticket-main">
        <!-- Injected dynamically -->
    </main>

    <script type="module">
        import { api } from '/js/api.js';
        import { formatCurrency, formatDate, formatTime } from '/js/utils.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const ticketId = urlParams.get('id');
            const mainEl = document.getElementById('ticket-main');

            if (!ticketId) {
                mainEl.innerHTML = `<div style="color:#ef4444;">Ticket ID missing</div>`;
                return;
            }

            try {
                const data = await api.getTicket(ticketId);
                const b = data.booking;

                mainEl.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 650px; margin: 0 auto 20px;">
                        <a href="/bookings.html" style="color: var(--text-muted);">← Back to My Bookings</a>
                        <div class="ticket-actions" style="display: flex; gap: 10px;">
                            <button onclick="window.print()" class="btn btn-secondary" style="padding: 6px 14px; font-size: 0.85rem;">🖨 Print Ticket</button>
                        </div>
                    </div>

                    <div class="ticket-container">
                        <div class="ticket-header">
                            <span>TICKETFLOW BOARDING PASS</span>
                            <span class="badge badge-available">VALID ENTRY</span>
                        </div>
                        <div class="ticket-body">
                            <div class="ticket-info" style="text-align: left;">
                                <span class="badge ${b.event_type === 'concert' ? 'badge-concert' : 'badge-movie'}" style="width: max-content;">${b.event_type.toUpperCase()}</span>
                                <h2 style="font-size: 1.5rem; color: var(--accent-primary); margin-top: 4px;">${b.event_title}</h2>
                                <p style="font-size: 0.9rem; color: var(--text-secondary);">📍 ${b.venue_name}</p>
                                <p style="font-size: 0.85rem; color: var(--text-muted);">${b.venue_address}</p>

                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: var(--radius-sm);">
                                    <div>
                                        <div style="font-size: 0.7rem; color: var(--text-muted);">DATE & TIME</div>
                                        <div style="font-size: 0.9rem; font-weight: 700;">${formatDate(b.start_date)} • ${formatTime(b.start_date)}</div>
                                    </div>
                                    <div>
                                        <div style="font-size: 0.7rem; color: var(--text-muted);">HOLDER</div>
                                        <div style="font-size: 0.9rem; font-weight: 700;">${b.customer_name}</div>
                                    </div>
                                    <div>
                                        <div style="font-size: 0.7rem; color: var(--text-muted);">SEAT NUMBERS</div>
                                        <div style="font-size: 1.1rem; font-weight: 800; color: var(--accent-secondary);">${b.seatLabels.join(', ')}</div>
                                    </div>
                                    <div>
                                        <div style="font-size: 0.7rem; color: var(--text-muted);">BOOKING REF</div>
                                        <div style="font-size: 1rem; font-family: monospace; font-weight: 800; color: var(--accent-primary);">${b.booking_ref}</div>
                                    </div>
                                </div>
                            </div>

                            <div class="ticket-qr">
                                <img src="${b.qrDataUrl}" alt="Ticket QR Code" />
                                <div style="font-size: 0.7rem; color: #000; font-weight: 700; margin-top: 4px;">SCAN FOR GATE ENTRY</div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                mainEl.innerHTML = `<div style="color:#ef4444;">Failed to load ticket: ${err.message}</div>`;
            }
        });
    </script>
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
