<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Waitlists & Priority Offers | TicketFlow</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/dashboard.css">

    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">🎟 <span>TicketFlow</span></a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-actions" id="nav-actions"></div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 80px; max-width: 900px;">
        <h1 class="section-title">My Waitlists & Time-Limited Offers</h1>
        <p class="section-subtitle">Track your FIFO queue positions and claim instant ticket offers when seats become available</p>

        <div id="waitlist-container">
            <!-- Loaded dynamically via js/waitlist.js -->
        </div>
    </main>

    <script type="module">
        import { loadWaitlists } from '/js/waitlist.js';
        import { initWebSocket } from '/js/websocket.js';

        document.addEventListener('DOMContentLoaded', () => {
            loadWaitlists();
            initWebSocket();
        });
    </script>
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
