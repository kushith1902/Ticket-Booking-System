<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | TicketFlow</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>
<body style="background: radial-gradient(circle at center, #131b2e, #0b0f19);">

    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">🎟 <span>TicketFlow</span></a>
        </div>
    </header>

    <div class="container" style="max-width: 440px; margin: 80px auto;">
        <div class="card" style="padding: 36px; box-shadow: var(--shadow-glow);">
            <h2 style="font-size: 1.6rem; text-align: center; margin-bottom: 8px;">Welcome Back</h2>
            <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem; margin-bottom: 24px;">Log in to access your tickets and waitlist offers</p>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="customer@example.com" required value="customer@example.com" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required value="Password123!" />
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Log In</button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
                Don't have an account? <a href="/register.html" style="color: var(--accent-primary); font-weight: 600;">Sign Up</a>
            </div>

            <!-- Quick Demo Auto fill Buttons -->
            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center;">
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px;">QUICK DEMO LOGIN AS:</div>
                <div style="display: flex; gap: 8px; justify-content: center;">
                    <button type="button" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="fillLogin('customer@example.com')">Customer</button>
                    <button type="button" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="fillLogin('organiser@ticketflow.com')">Organiser</button>
                    <button type="button" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="fillLogin('admin@ticketflow.com')">Admin</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
    <script>
        function fillLogin(email) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = 'Password123!';
        }
    </script>
</body>
</html>
