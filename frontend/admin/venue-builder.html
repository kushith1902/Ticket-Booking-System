<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Venue Layout Builder | TicketFlow Admin</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/seats.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">🎟 <span>TicketFlow Admin</span></a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-actions" id="nav-actions"></div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 80px;">
        <h1 class="section-title">Visual Venue & Seat Layout Builder</h1>
        <p class="section-subtitle">Interactively build custom cinema halls and stadium seating blueprints</p>

        <div style="display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; align-items: start;">
            <!-- Controls Form -->
            <div class="card" style="padding: 24px;">
                <h3 style="font-size: 1.1rem; margin-bottom: 16px;">Venue Properties</h3>
                <div class="form-group">
                    <label class="form-label">Venue Name</label>
                    <input type="text" id="venue-name" class="form-control" placeholder="e.g. Royal Opera House" value="Royal Opera House" required />
                </div>
                <div class="form-group">
                    <label class="form-label">City / Location</label>
                    <input type="text" id="venue-location" class="form-control" placeholder="e.g. Chennai" value="Chennai" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Street Address</label>
                    <input type="text" id="venue-address" class="form-control" placeholder="123 Arts Avenue" value="123 Arts Avenue, Chennai" required />
                </div>

                <hr style="border:0; border-top: 1px solid var(--border-color); margin: 20px 0;" />

                <h3 style="font-size: 1.1rem; margin-bottom: 16px;">Grid Blueprint</h3>
                <div class="form-group">
                    <label class="form-label">Number of Rows</label>
                    <input type="number" id="builder-rows" class="form-control" value="6" min="1" max="10" />
                </div>
                <div class="form-group">
                    <label class="form-label">Seats Per Row</label>
                    <input type="number" id="builder-seats-per-row" class="form-control" value="8" min="2" max="16" />
                </div>

                <button id="generate-layout-btn" class="btn btn-secondary" style="width: 100%; margin-bottom: 16px;">Re-Generate Layout Grid</button>
                <button id="save-venue-btn" class="btn btn-primary" style="width: 100%; padding: 14px;">SAVE VENUE LAYOUT</button>
            </div>

            <!-- Visual Canvas -->
            <div class="seat-map-wrapper" style="min-height: 480px; justify-content: center;">
                <div class="cinema-screen"></div>
                <div class="screen-text">SCREEN / STAGE PREVIEW</div>

                <div id="builder-canvas">
                    <!-- Grid generated by js/admin.js -->
                </div>

                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 24px; text-align: center;">
                    💡 Tip: Click any seat square to cycle its tier (VIP → Premium → Standard → Economy).
                </p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initVenueBuilder } from '/js/admin.js';

        document.addEventListener('DOMContentLoaded', () => {
            initVenueBuilder();
        });
    </script>
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
