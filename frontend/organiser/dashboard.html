<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiser Portal Dashboard | TicketFlow</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">🎟 <span>TicketFlow Organiser</span></a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-actions" id="nav-actions"></div>
        </div>
    </header>

    <main class="container" style="padding-top: 40px; padding-bottom: 80px;">
        <div class="flex-between" style="margin-bottom: 30px;">
            <div>
                <h1 class="section-title">Organiser Analytics & Management</h1>
                <p class="section-subtitle">Real-time revenue, occupancy rate, and event sales overview</p>
            </div>
            <a href="/organiser/create-event.html" class="btn btn-primary">+ Create New Event</a>
        </div>

        <!-- Metrics Overview Grid -->
        <div class="metrics-grid" id="organiser-metrics">
            <!-- Loaded dynamically -->
        </div>

        <!-- Event List Table -->
        <h3 style="font-size: 1.25rem; margin-bottom: 16px;">My Managed Events</h3>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Event & Venue</th>
                        <th>Start Date</th>
                        <th>Occupancy</th>
                        <th>Gross Revenue</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="organiser-events-body">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initOrganiserDashboard } from '/js/organiser.js';

        document.addEventListener('DOMContentLoaded', () => {
            initOrganiserDashboard();
        });
    </script>
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
